name: build devel bench

on:
  push:
    branches:
      - build-devel-bench

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Getting LFS files
      run: git lfs pull
    - name: stock build_stripped on post-38371 master
      run: |
        time TARGET_DIR=$RUNNER_TEMP/rp_a tools/release/build_stripped.sh > /tmp/a.log 2>&1 || (tail -8 /tmp/a.log; exit 1)
        grep "] .* T=" /tmp/a.log
